<!DOCTYPE html>
<html lang="en-IN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Journey · Trading Journal &amp; Discipline Tracker</title>
<style>
/* Neumorphic (soft UI) — palette 3: #1D39CF deep blue · #16CABD teal · #9EDFE5 aqua · #9ED0FF sky · #2191FF bright blue
   Surfaces share ONE base colour; depth comes only from paired light/dark shadows (raised = out, pressed/inputs = in). */
:root{--o:8px;--bl:18px;--os:4px;--bs:9px;
--bg:#DDEBFA;--sl:#FFFFFF;--sd:#AEC3DD;--s1:#E5F0FC;--s2:#D5E4F5;--card:#DDEBFA;
--ink:#0F1F5C;--mut:#46598F;--calm:#C3D6EC;--bluet:#1D39CF;--redt:#B8132B;--red:#E44B58;--teal:#16CABD;--amber:#F2B01E;
--bd:rgba(29,57,207,.1);--sel:rgba(33,145,255,.14);--in:#DDEBFA;--line:#B7CCE6;--okbg:rgba(33,145,255,.12);--warnbg:rgba(228,75,88,.12);--warnt:#8F1224;--wbg:rgba(22,202,189,.18);--lbg:rgba(228,75,88,.14);
--glow:rgba(255,255,255,.55);
--raise:var(--o) var(--o) var(--bl) var(--sd),calc(-1*var(--o)) calc(-1*var(--o)) var(--bl) var(--sl);
--raise-s:var(--os) var(--os) var(--bs) var(--sd),calc(-1*var(--os)) calc(-1*var(--os)) var(--bs) var(--sl);
--inset:inset var(--o) var(--o) var(--bl) var(--sd),inset calc(-1*var(--o)) calc(-1*var(--o)) var(--bl) var(--sl);
--inset-s:inset var(--os) var(--os) var(--bs) var(--sd),inset calc(-1*var(--os)) calc(-1*var(--os)) var(--bs) var(--sl);
--conv:linear-gradient(145deg,var(--s1),var(--s2));--conc:linear-gradient(145deg,var(--s2),var(--s1));
--pri:linear-gradient(145deg,#2191FF,#1D39CF);--dng:linear-gradient(145deg,#FF6B7A,#D32F45);--screen:var(--conc);
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light}
:root[data-theme=dark]{--bg:#131B3E;--sl:#1E2A5E;--sd:#080C24;--s1:#18224C;--s2:#10173A;--card:#131B3E;
--ink:#E6EEFF;--mut:#A3B3E2;--calm:#2A3868;--bluet:#7DB5FF;--redt:#FF8A98;--bd:rgba(158,208,255,.12);--sel:rgba(33,145,255,.22);--in:#131B3E;--line:#2D3C70;
--okbg:rgba(33,145,255,.2);--warnbg:rgba(255,107,122,.16);--warnt:#FFC2C9;--wbg:rgba(22,202,189,.2);--lbg:rgba(255,107,122,.18);--glow:rgba(33,145,255,.1);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:80px}[hidden]{display:none!important}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vw 45vh at 8% 0,var(--glow),transparent)}
:focus-visible{outline:3px solid var(--bright,#2191FF);outline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}button{touch-action:manipulation}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* ---- shell ---- */
.app{display:flex;min-height:100vh}.shell{flex:1;min-width:0}
.rail{width:244px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg);box-shadow:10px 0 22px -12px var(--sd);transition:width .2s;z-index:25}
.rail.c{width:84px}.rail.c .lb,.rail.c .it::after{display:none}.rail.c .rb,.rail.c .it{justify-content:center}.rail.c #rc svg{transform:rotate(180deg)}
.rb{display:flex;gap:10px;align-items:center;padding:4px 6px 16px}
.logo{width:40px;height:40px;border-radius:14px;background:var(--pri);display:grid;place-items:center;flex:none;box-shadow:var(--raise-s)}
.bt{font-weight:700;letter-spacing:-.01em;line-height:1.2}.bt small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
#rnav{display:flex;flex-direction:column;gap:8px;flex:1;overflow:auto;padding:6px}
.it{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:0;background:none;cursor:pointer;color:var(--mut);font-weight:600;text-align:left;width:100%;min-height:44px;transition:box-shadow .15s,color .15s}
.it:hover{box-shadow:var(--raise-s);color:var(--ink)}.it:active{box-shadow:var(--inset-s)}
.it[aria-current=page]{box-shadow:var(--inset-s);color:var(--bluet)}
.it[aria-current=page]::after{content:"";width:8px;height:8px;border-radius:50%;margin-left:auto;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.rf{display:flex;align-items:center;gap:6px;padding-top:10px}.who{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.rf .it{width:auto;padding:8px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 28px;background:var(--bg);box-shadow:0 12px 20px -16px var(--sd)}
.ttl{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}.tt small{color:var(--mut);font-size:12px}
.act{display:flex;gap:12px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--bg);box-shadow:var(--inset-s);font-size:12px;white-space:nowrap}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:#8aa0c2}
.pill[data-s=ok]::before{background:var(--teal);box-shadow:0 0 8px var(--teal)}.pill[data-s=busy]::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}.pill[data-s=err]::before{background:var(--red);box-shadow:0 0 8px var(--red)}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:var(--conv);box-shadow:var(--raise-s);cursor:pointer;display:inline-grid;place-items:center;color:var(--ink);transition:box-shadow .12s}
.ib:active{box-shadow:var(--inset-s)}.ib.sm{width:36px;height:36px;border-radius:12px}.ib.dng:hover{color:var(--redt)}.ib:hover{color:var(--bluet)}
.btn{border:0;border-radius:14px;padding:11px 20px;background:var(--conv);color:var(--ink);font-weight:650;cursor:pointer;box-shadow:var(--raise-s);transition:box-shadow .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{color:var(--bluet)}.btn:active{box-shadow:var(--inset-s)}
.btn.p{background:var(--pri);color:#fff}.btn.p:hover{color:#fff;filter:brightness(1.06)}.btn.p:active{box-shadow:inset 3px 3px 8px rgba(0,0,40,.45),inset -2px -2px 6px rgba(255,255,255,.2)}
.btn.d{background:var(--dng);color:#fff}.btn.d:hover{color:#fff}.btn.d:active{box-shadow:inset 3px 3px 8px rgba(80,0,0,.45),inset -2px -2px 6px rgba(255,255,255,.2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{padding:24px 28px 64px;max-width:1440px;margin:0 auto}
main>h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}h2{font-size:15px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}h3{font-size:14px;margin:0 0 6px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);box-shadow:0 -10px 20px -12px var(--sd);padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;gap:4px}
.tb{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:650;color:var(--mut);padding:6px 2px;min-height:52px;border-radius:14px;cursor:pointer}
.tb[aria-current=page]{color:var(--bluet);box-shadow:var(--inset-s)}
.fab{display:none;position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;box-shadow:var(--raise);cursor:pointer}
.fab:active{box-shadow:inset 3px 3px 8px rgba(0,0,40,.45)}
.sheet{display:grid;gap:8px}.it.big{font-size:16px;min-height:54px;box-shadow:var(--raise-s)}
/* ---- surfaces ---- */
.grid{display:grid;gap:22px;grid-template-columns:repeat(12,1fr)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--conv);border-radius:26px;padding:20px;box-shadow:var(--raise);min-width:0}
.card.in{background:var(--conc);box-shadow:var(--inset)}
.hero .lab,.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:650}
.kpi .l{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi .v,.hero .big{background:var(--conc);color:var(--bluet);border-radius:16px;padding:10px 14px;margin:10px 0 4px;font-weight:700;letter-spacing:-.01em;box-shadow:var(--inset-s);overflow-wrap:anywhere}
.kpi .v{font-size:20px}.hero .big{font-size:32px;margin:8px 0 12px}
.kpi .v.dn{color:var(--redt)}
.kpi .info{border:0;background:var(--conv);box-shadow:var(--raise-s);color:var(--bluet);width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:700;font-size:12px}.kpi .info:active{box-shadow:var(--inset-s)}
.kpi p{margin:8px 0 0;font-size:12px;color:var(--mut)}
.up{color:var(--bluet)}.dn{color:var(--redt)}.mut{color:var(--mut)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:650;background:var(--bg);color:var(--bluet);white-space:nowrap;box-shadow:var(--inset-s)}
.tag.ls,.tag.sh{color:var(--redt)}.tag.n{color:var(--mut)}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap;padding:6px;border-radius:999px;background:var(--bg);box-shadow:var(--inset-s)}
.chips .chip{background:transparent;box-shadow:none;min-height:36px}
.chip{border:0;padding:8px 16px;border-radius:999px;background:var(--conv);box-shadow:var(--raise-s);cursor:pointer;font-weight:600}.chip:active{box-shadow:var(--inset-s)}
.chips .chip[aria-pressed=true]{background:var(--conv);box-shadow:var(--raise-s);color:var(--bluet);font-weight:750}
.bar{justify-content:space-between;align-items:center;margin-bottom:20px}
.status{border-radius:16px;padding:12px 16px;font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:10px;box-shadow:var(--inset-s);background:var(--bg)}
.status.ok{color:var(--bluet)}.status.warn{color:var(--redt)}.status.bad{background:var(--dng);color:#fff;box-shadow:var(--raise-s)}
.bubbles{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;min-height:150px}
.bub{border-radius:50%;display:grid;place-content:center;text-align:center;font-size:11px;padding:4px;box-shadow:var(--raise-s)}.bub b{font-size:17px;font-family:var(--mono)}
.bub.h{background:var(--pri);color:#fff}.bub.m{background:linear-gradient(145deg,#B8ECF0,#7FD3DA);color:#0F1F5C}.bub.l{background:var(--dng);color:#fff}.bub.n{background:var(--conv);color:var(--mut)}
svg.ch{width:100%;height:auto;display:block;background:var(--conc);border-radius:16px;box-shadow:var(--inset-s)}svg text{font:10px var(--mono);fill:var(--mut)}
.tw{overflow-x:auto;padding:4px}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:11px 7px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}th button{border:0;background:none;font:inherit;font-weight:700;cursor:pointer;text-transform:inherit;letter-spacing:inherit;color:inherit}
tbody tr:hover td{background:var(--sel)}td.num{text-align:right}td.acts .row{flex-wrap:nowrap;gap:8px}
table.rt td:nth-child(4){white-space:normal;min-width:100px;max-width:120px}
table.rt th:last-child,table.rt tbody tr td.acts{position:sticky;right:0;background:var(--bg);box-shadow:-12px 0 12px -12px var(--sd)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut);min-width:130px;flex:1;font-weight:600}
input,select,textarea{background:var(--bg);border:0;border-radius:14px;padding:10px 13px;min-height:44px;color:var(--ink);box-shadow:var(--inset-s)}
textarea{width:100%;display:block;min-height:68px;resize:vertical}
label input:not([type=checkbox]),label select,label textarea{width:100%;min-width:0;max-width:100%}
input[type=checkbox]{min-height:0;width:22px;height:22px;accent-color:#1D39CF;box-shadow:none}
label.ck{flex-direction:row;align-items:center;gap:10px;color:var(--ink);min-width:200px}
dialog{border:0;border-radius:30px;padding:24px;max-width:min(920px,96vw);width:100%;max-height:92vh;max-height:92dvh;background:var(--conv);box-shadow:0 30px 70px -20px var(--sd),var(--raise);color:var(--ink);overflow-x:hidden}
dialog::backdrop{background:rgba(15,31,92,.4);backdrop-filter:blur(5px)}
fieldset{min-width:0;border:0;background:var(--conv);border-radius:22px;padding:16px;margin:0 0 16px;box-shadow:var(--raise-s)}legend{font-weight:700;padding:0 8px}
.f{display:flex;flex-wrap:wrap;gap:12px}
.warn-l{background:var(--bg);color:var(--redt);border-radius:14px;padding:9px 13px;margin:8px 0;font-size:13px;box-shadow:var(--inset-s)}
.empty{padding:28px;text-align:center;color:var(--mut);border-radius:20px;background:var(--conc);box-shadow:var(--inset-s)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.cal .h{font-size:11px;color:var(--mut);text-align:center}
.day{min-height:78px;border:0;border-radius:14px;background:var(--conv);box-shadow:var(--raise-s);padding:7px;text-align:left;cursor:pointer;font-size:11.5px;color:var(--ink)}
.day.w{box-shadow:var(--raise-s),inset 0 -3px 0 var(--teal)}.day.l{box-shadow:var(--raise-s),inset 0 -3px 0 var(--red)}.day:active{box-shadow:var(--inset-s)}
.sticky{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding-top:10px;background:linear-gradient(transparent,var(--s1) 45%)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--bg);color:var(--ink);font-weight:600;box-shadow:var(--raise);padding:12px 20px;border-radius:16px;z-index:99;display:none;max-width:92vw;text-align:center}
.demo{background:var(--conv);color:var(--ink);padding:10px 18px;border-radius:18px;margin-bottom:18px;font-weight:650;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:var(--raise-s);border-left:6px solid var(--amber)}
body.lock .app,body.lock .tabbar,body.lock .fab{display:none}
#auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;overflow:auto}
.lg{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.lcard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;font:inherit;color:inherit;border:0;transition:box-shadow .15s}.lcard:hover{box-shadow:var(--raise),0 0 0 2px var(--sel)}.lcard:active{box-shadow:var(--inset)}
svg.dg{width:100%;height:auto;display:block;background:var(--conc);border-radius:16px;box-shadow:var(--inset-s)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-top:12px;color:var(--mut)}.lgd i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.step:last-child{border:0}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--conv);box-shadow:var(--raise-s);color:var(--bluet);display:grid;place-items:center;font-weight:700;font-size:13px}
ul.tight{margin:6px 0;padding-left:18px}ul.tight li{margin:4px 0}
@media(max-width:1000px){.c3{grid-column:span 6}.c4,.c6,.c8{grid-column:span 12}}
@media(max-width:900px){.rail{display:none}.tabbar{display:flex}.fab{display:grid;place-items:center}header.top{padding:10px 16px}main{padding:18px 16px 150px}#add{display:none}#toast{bottom:calc(92px + env(safe-area-inset-bottom))}}
@media(max-width:760px){
 :root{--o:5px;--bl:12px;--os:3px;--bs:7px}
 body{font-size:15px}input,select,textarea{font-size:16px}.grid{gap:16px}.card{padding:16px;border-radius:22px}.hero .big{font-size:26px}.kpi .v{font-size:17px;padding:8px 10px}
 .tt small{display:none}.ttl{font-size:18px}.pill{font-size:11px;padding:6px 11px}th,td{white-space:normal}.card table{table-layout:auto}
 dialog{margin:auto 0 0;max-width:100vw;width:100vw;max-height:94dvh;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
 .f label{min-width:calc(50% - 6px)}label.ck{min-width:100%}.bar{align-items:stretch}
 .chips{flex-wrap:nowrap;overflow-x:auto;max-width:100%}.chip{white-space:nowrap}
 .day{min-height:58px;padding:4px;font-size:10px}.cal{gap:6px}
 table.rt thead{display:none}table.rt,table.rt tbody,table.rt tr,table.rt td{display:block}
 table.rt tr{background:var(--conv);border-radius:20px;padding:10px 14px;margin:0 4px 16px;box-shadow:var(--raise-s)}
 table.rt td,table.rt tbody tr:hover td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:5px 0;white-space:normal;text-align:right;background:none;max-width:none}
 table.rt td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left}table.rt tbody tr td.acts{justify-content:flex-end;padding-top:10px;position:static;box-shadow:none;background:none}table.rt td.acts::before{display:none}}

/* ---- Markets ---- */
:root{--gn:#0A8F6A;--rd:#D12F44;--gnr:10,143,106;--rdr:209,47,68}
:root[data-theme=dark]{--gn:#3DDC97;--rd:#FF7A8A;--gnr:61,220,151;--rdr:255,122,138}
.gn{color:var(--gn)}.rd{color:var(--rd)}.btn.sm{padding:6px 14px;min-height:34px;font-size:13px;border-radius:12px}
.fbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.fbar .sp{flex:1}.upd{font-size:12.5px}
.ms{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;background:var(--bg);box-shadow:var(--inset-s);font-weight:650;font-size:13px}
.ms i{width:10px;height:10px;border-radius:50%;background:#8aa0c2}.ms.open i{background:var(--gn);box-shadow:0 0 0 0 rgba(var(--gnr),.6);animation:pulse 1.8s infinite}.ms.pre i{background:var(--amber)}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(var(--gnr),0)}100%{box-shadow:0 0 0 0 rgba(var(--gnr),0)}}
.ib.on{color:var(--amber);box-shadow:var(--inset-s)}.ib.on svg{fill:currentColor}.spin svg{animation:rot .9s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.falert{border-radius:18px;padding:12px 16px;margin-bottom:18px;background:var(--warnbg);color:var(--warnt);box-shadow:var(--inset-s);font-weight:550;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.falert code,.card code{font-family:var(--mono);font-size:.92em;padding:1px 6px;border-radius:7px;background:var(--bg);box-shadow:var(--inset-s)}
.fidx{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;margin-bottom:22px}
.ft{border:0;text-align:left;cursor:pointer;color:var(--ink);padding:14px 16px;border-radius:22px;background:var(--conv);box-shadow:var(--raise-s);display:grid;gap:2px;min-width:0;transition:box-shadow .12s}
.ft:active{box-shadow:var(--inset-s)}.ft.on{background:var(--conc);box-shadow:var(--inset-s);outline:2px solid var(--teal);outline-offset:-2px}
.ftn{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftp{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}.ftc{font-size:12.5px;font-weight:650}
.spark{width:100%;height:30px;margin-top:6px;display:block}
.ft.cp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;box-shadow:var(--raise-s)}.ft.cp .ftn{flex:1;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)}.ft.cp .ftp{font-size:14.5px;text-align:right}.ft.cp .ftc{min-width:64px;text-align:right}

const parseEx=t=>(t.exits||'').split('\n').map(l=>l.trim().match(/^(\d+(?:\.\d+)?)\s*@\s*(\d+(?:\.\d+)?)$/)).filter(Boolean).map(m=>[+m[1],+m[2]]);

/* Zerodha NSE rate card, derived from the supplied brokerage-calculator screenshots (qty 400; every line reproduced to the paisa).
   Rates change — re-verify at zerodha.com/brokerage-calculator. Calculated, not broker-confirmed. */
const RATES={intraday:{pct:.0003,cap:20,sttB:0,sttS:.00025,exch:.0000307,stamp:.00003},delivery:{pct:0,cap:0,sttB:.001,sttS:.001,exch:.0000307,stamp:.00015},
 futures:{flat:20,sttB:0,sttS:.0005,exch:.0000183,stamp:.00002},options:{flat:20,sttB:0,sttS:.0015,exch:.0003553,stamp:.00003},sebi:.000001,gst:.18};
function autoChg(t,c){
 const seg=/Option/.test(t.itype)?'options':t.itype==='Futures'?'futures':t.style==='Intraday'?'intraday':'delivery',R=RATES[seg],q=+t.qty,e=+t.entry;
 const exits=parseEx(t).concat(c.rem>0?[[c.rem,+t.exit]]:[]),ev=e*q,xv=exits.reduce((a,x)=>a+x[0]*x[1],0),lg=t.dir!=='Short',buy=lg?ev:xv,sell=lg?xv:ev;
 const orders=[ev,...exits.map(x=>x[0]*x[1])],r2=x=>Math.round(x*100)/100;                    // brokerage is charged per executed order
 const brok=r2(seg==='delivery'?0:R.flat?R.flat*orders.length:orders.reduce((a,v)=>a+Math.min(R.cap,v*R.pct),0));
 const stt=r2(sell*R.sttS+buy*R.sttB),exch=r2((buy+sell)*R.exch),sebi=r2((buy+sell)*RATES.sebi),gst=r2((brok+exch+sebi)*RATES.gst),stamp=Math.round(buy*R.stamp);   // stamp duty rounds to whole ₹
 const o={seg,brok:P(brok),stt:P(stt),exch:P(exch),gst:P(gst),sebi:P(sebi),stamp:P(stamp)};o.total=o.brok+o.stt+o.exch+o.gst+o.sebi+o.stamp;return o}
function calc(t){
 const q=+t.qty||0,e=+t.entry||0,dir=t.dir==='Short'?-1:1,ex=parseEx(t),rem=q-ex.reduce((a,x)=>a+x[0],0);
 const risk=t.stop?Math.round(Math.abs(P(e)-P(t.stop))*q):null,reward=t.target?Math.round(Math.abs(P(t.target)-P(e))*q):null;
 const c={q,rem,risk,reward,rr:risk&&reward?reward/risk:null,pos:Math.round(P(e)*q),closed:t.status==='Closed'};
 if(c.closed){
  if(q<=0||rem<0||(rem>0&&(t.exit===''||t.exit==null)))c.bad='Exit quantities do not reconcile with entry quantity';
  else{const pr=ex.reduce((a,x)=>a+Math.round(P(x[1])*x[0]),0)+(rem>0?Math.round(P(t.exit)*rem):0);
   c.gross=dir*(pr-c.pos);
   c.chd=t.chMode==='auto'?autoChg(t,c):null;
   c.chg=c.chd?c.chd.total:t.chTotal!==''&&t.chTotal!=null?P(t.chTotal):P(t.chBrok)+P(t.chStt)+P(t.chOther);     // manual: total overrides details, no double counting
   c.net=c.gross-c.chg;c.out=c.net>0?'Win':c.net<0?'Loss':'Breakeven';
   c.R=risk>0?c.net/risk:null;c.ret=c.pos?c.net/c.pos:null;c.mins=dur(t)}}
 return c}
const chron=(a,b)=>(a.date+(a.entryTime||'')).localeCompare(b.date+(b.entryTime||''));
const VL=['No predefined stop','Exceeded planned risk','Impulsive entry','Revenge trade','FOMO entry','Overtrading','Unplanned stop move','Outside trading window','No valid setup','Traded after limit'];
const riskLimit=()=>{const s=settings();return s.riskRs>0?s.riskRs*100:Math.round(s.refCap*100*s.riskPct/100)};
function enrich(list){
 const s=settings(),day={},rl=riskLimit();
 return [...list].sort(chron).map(t=>{
  const c=calc(t),ex=t.status==='Open'||t.status==='Closed',d=day[t.date]||(day[t.date]={n:0,net:0}),v=[];
  c.limOK=!(d.n>=s.maxTrades||-d.net>=s.maxLoss*100);
  if(ex){d.n++;if(c.net!=null)d.net+=c.net;
   if(!t.stop)v.push(VL[0]);if(c.risk&&c.risk>rl)v.push(VL[1]);if(t.impulsive)v.push(VL[2]);if(t.revenge)v.push(VL[3]);if(t.fomo)v.push(VL[4]);if(t.over)v.push(VL[5]);if(t.movedSL)v.push(VL[6]);
   const tm=(t.entryTime||'').slice(11,16);if(tm&&(tm<s.hrFrom||tm>s.hrTo))v.push(VL[7]);if(!t.setup)v.push(VL[8]);if(!c.limOK)v.push(VL[9]);
   const k={},yn=x=>x==='Y'?1:x==='N'?0:undefined;
   k.chk=t.chkTotal?(t.checked||[]).length/t.chkTotal:undefined;
   k.risk=!t.stop||(c.risk&&c.risk>rl)?0:(yn(t.fRisk)??1);k.entry=yn(t.fEntry);k.exit=c.closed?yn(t.fExit):undefined;k.lim=c.limOK?1:0;
   k.beh=Math.max(0,1-.34*['fomo','revenge','impulsive','movedSL','early','over'].filter(f=>t[f]).length);
   let a=0,b=0;for(const x in k)if(k[x]!==undefined){a+=s.w[x]*k[x];b+=s.w[x]}   // missing data is excluded, weights renormalised

  c.v=v;return {...t,c}})}

function M(L,o={}){

 return {n,w:w.length,l:l.length,be:n-w.length-l.length,wr:n?w.length/n:null,gp,gl,net,avgW:w.length?gp/w.length:null,avgL:l.length?-gl/l.length:null,

const FN_SRC="// Supabase Edge Function: yf-proxy\n// Read-only proxy for Yahoo Finance public chart/search endpoints, the same endpoints the\n// `yfinance` Python library uses (query1/query2.finance.yahoo.com /v8/finance/chart and /v1/finance/search).\n// Browsers cannot call Yahoo directly (CORS), so the Trade Journey app calls this function instead.\n// Deploy:  supabase functions deploy yf-proxy      (dashboard: Edge Functions -> yf-proxy -> paste this file -> Deploy)\n// \"Verify JWT\" may stay ON or OFF: the function also verifies the caller's Supabase session itself (see authed()).\n//\n// Modes (all GET):\n//   ?symbols=A,B&range=1d&interval=5m   chart data per symbol (v8/finance/chart, no crumb needed)\n//   ?mode=quotes&symbols=A,B,...        batch quotes: price / change % / volume / market cap\n//                                       (v7/finance/quote with cookie+crumb exactly like yfinance; falls back to chart data)\n//   ?mode=pcr&symbol=NIFTY              put-call ratio from the NSE option chain (best effort; NSE may block cloud IPs)\n//   ?q=reliance                         symbol search (Indian listings only)\n\nconst CORS = {\n  \"Access-Control-Allow-Origin\": \"*\",\n  \"Access-Control-Allow-Headers\": \"authorization, x-client-info, apikey, content-type\",\n  \"Access-Control-Allow-Methods\": \"GET, OPTIONS\",\n};\nconst UA = \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36\";\nconst RANGES = new Set([\"1d\", \"5d\", \"1mo\", \"3mo\", \"6mo\", \"1y\", \"5y\"]);\nconst INTERVALS = new Set([\"1m\", \"2m\", \"5m\", \"15m\", \"30m\", \"60m\", \"1d\", \"1wk\"]);\nconst SYMBOL = /^[A-Za-z0-9^.=&-]{1,24}$/;\nconst HOSTS = [\"query1.finance.yahoo.com\", \"query2.finance.yahoo.com\"];\nconst cache = new Map<string, { t: number; v: unknown }>();\nconst SB_URL = Deno.env.get(\"SUPABASE_URL\") || \"\";\nconst SB_KEY = Deno.env.get(\"SUPABASE_ANON_KEY\") || \"\";\nconst okTokens = new Map<string, number>();\n\n// Only signed-in users of this Supabase project may use the proxy.\nasync function authed(req: Request): Promise<boolean> {\n  const a = req.headers.get(\"authorization\") || \"\";\n  if (!/^Bearer\\s+\\S+/i.test(a)) return false;\n  const seen = okTokens.get(a);\n  if (seen && Date.now() - seen < 60000) return true;\n  try {\n    const r = await fetch(SB_URL + \"/auth/v1/user\", { headers: { Authorization: a, apikey: SB_KEY } });\n    if (!r.ok) return false;\n    okTokens.set(a, Date.now());\n    if (okTokens.size > 200) okTokens.delete(okTokens.keys().next().value as string);\n    return true;\n  } catch (_e) {\n    return false;\n  }\n}\n\nconst reply = (body: unknown, status = 200) =>\n  new Response(JSON.stringify(body), {\n    status,\n    headers: { ...CORS, \"Content-Type\": \"application/json\", \"Cache-Control\": \"no-store\" },\n  });\n\nasync function yahoo(path: string) {\n  let last = \"Yahoo request failed\";\n  for (const host of HOSTS) {\n    try {\n      const r = await fetch(\"https://\" + host + path, { headers: { \"User-Agent\": UA, Accept: \"application/json\" } });\n      if (r.ok) return await r.json();\n      last = \"Yahoo returned HTTP \" + r.status;\n    } catch (e) {\n      last = String((e as Error).message || e);\n    }\n  }\n  throw new Error(last);\n}\n\nasync function cached<T>(key: string, ttlMs: number, load: () => Promise<T>): Promise<T> {\n  const hit = cache.get(key);\n  if (hit && Date.now() - hit.t < ttlMs) return hit.v as T;\n  const v = await load();\n  cache.set(key, { t: Date.now(), v });\n  if (cache.size > 400) cache.delete(cache.keys().next().value as string);\n  return v;\n}\n\nfunction chart(sym: string, range: string, interval: string) {\n  return cached([\"c\", sym, range, interval].join(\"|\"), 8000, async () => {\n    const j = await yahoo(\n      \"/v8/finance/chart/\" + encodeURIComponent(sym) + \"?range=\" + range + \"&interval=\" + interval + \"&includePrePost=false\",\n    );\n    const r = j && j.chart && j.chart.result && j.chart.result[0];\n    if (!r) throw new Error((j && j.chart && j.chart.error && j.chart.error.description) || \"No data\");\n    const m = r.meta || {};\n    const q = (r.indicators && r.indicators.quote && r.indicators.quote[0]) || {};\n    const keep = [\n      \"symbol\", \"shortName\", \"longName\", \"currency\", \"exchangeName\", \"fullExchangeName\", \"instrumentType\",\n      \"regularMarketPrice\", \"regularMarketTime\", \"regularMarketDayHigh\", \"regularMarketDayLow\", \"regularMarketVolume\",\n      \"fiftyTwoWeekHigh\", \"fiftyTwoWeekLow\", \"chartPreviousClose\", \"previousClose\", \"exchangeTimezoneName\",\n    ];\n    const meta: Record<string, unknown> = {};\n    for (const k of keep) if (m[k] !== undefined) meta[k] = m[k];\n    return { meta, t: r.timestamp || [], c: q.close || [], v: q.volume || [] };\n  });\n}\n\n\n// ---------- batch quotes (same cookie + crumb flow as yfinance data.py) ----------\nlet crumbState: { crumb: string; cookie: string; t: number } | null = null;\nasync function getCrumb(force = false) {\n  if (!force && crumbState && Date.now() - crumbState.t < 25 * 60000) return crumbState;\n  let cookie = \"\";\n  try {\n    const r0 = await fetch(\"https://fc.yahoo.com\", { headers: { \"User-Agent\": UA }, redirect: \"manual\" });\n    const sc: string[] = (r0.headers as any).getSetCookie ? (r0.headers as any).getSetCookie() : [];\n    cookie = sc.map((c) => c.split(\";\")[0]).join(\"; \");\n  } catch (_e) { /* fc.yahoo.com is optional, like in yfinance */ }\n  const r1 = await fetch(\"https://query1.finance.yahoo.com/v1/test/getcrumb\", { headers: { \"User-Agent\": UA, Cookie: cookie } });\n  const crumb = (await r1.text()).trim();\n  if (!r1.ok || !crumb || crumb.includes(\"<\") || /too many/i.test(crumb)) throw new Error(\"Yahoo crumb unavailable\");\n  crumbState = { crumb, cookie, t: Date.now() };\n  return crumbState;\n}\nasync function v7quote(symbols: string[], retry = true): Promise<any[]>
