<html lang="en-IN"><head><meta charset="utf-8">

<style>

 nav.dock button{padding:10px 4px;font-size:11px;min-height:44px;flex:1}

<script>
'use strict';
/* ================= Core helpers (safe DOM, no eval, no external calls) ================= */
const $=(s,r=document)=>r.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}c.flat(9).forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)))});return e};
const S=(t,a={},...c)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);c.flat().forEach(x=>x!=null&&e.append(x.nodeType?x:document.createTextNode(String(x))));return e};
const NF=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2,minimumFractionDigits:2});
const inr=p=>p==null||!isFinite(p)?'N/A':(p<0?'−':'')+'₹'+NF.format(Math.abs(p)/100);          // money is held in integer paise
const sg=p=>p==null?'':p>0?'▲ ':p<0?'▼ ':'● ';
const cmp=p=>{const a=Math.abs(p)/100,s=p<0?'−':'';return s+(a>=1e7?(a/1e7).toFixed(1)+'Cr':a>=1e5?(a/1e5).toFixed(1)+'L':a>=1e3?(a/1e3).toFixed(1)+'k':Math.round(a))};
const pct=x=>x==null||!isFinite(x)?'N/A':(x*100).toFixed(1)+'%';
const nz=(x,d=2)=>x==null||!isFinite(x)?'N/A':x.toFixed(d);
const P=x=>Math.round((+x||0)*100);
const tone=p=>p>0?'up':p<0?'dn':'';
const ist=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(d);
const today=()=>ist(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=s=>(new Date(s+'T00:00:00Z').getUTCDay()+6)%7;           // Monday = 0 (IST calendar day)
const monday=s=>addDays(s,-dow(s));
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',3200)};
const dl=(name,txt,type)=>{const a=h('a',{href:URL.createObjectURL(new Blob([txt],{type})),download:name});document.body.append(a);a.click();a.remove()};

/* ================= State, schema versioning, autosave ================= */
let KEY='tj.v1';const SCHEMA=1;
const DEF={capital:500000,refCap:500000,riskPct:1,riskRs:0,maxLoss:5000,maxTrades:5,maxConsec:3,maxOpen:3,maxAgg:15000,wkLoss:15000,hrFrom:'09:15',hrTo:'15:30',
 checklist:['I have identified the market context','My setup matches my written playbook','My entry trigger is present','My stop-loss is defined','My target and exit conditions are defined','My position size is within my risk limit','My daily loss limit has not been breached','I am not entering from FOMO or revenge','The trade has a clear invalidation condition'],
 w:{chk:20,risk:20,entry:15,exit:15,lim:15,beh:15}};
const freshD=()=>({v:SCHEMA,settings:JSON.parse(JSON.stringify(DEF)),trades:[],demo:[],cashflows:[],strategies:[],reviews:{},cooldown:null,ui:{view:'overview',demo:false,cal:today().slice(0,7),wk:0}});let D=freshD();
const F={period:'all',q:'',from:'',to:'',strategy:'',style:'',dir:'',outcome:'',page:0,sort:'date',desc:true};
function migrate(o){/* future: if(o.v<2){...;o.v=2} */return o}
let ST='Saved';const CS={txt:'',hash:''};
function setStatus(s){ST=s;$('#status').textContent=s+(CS.txt?' · '+CS.txt:'')}
const cloud=t=>{CS.txt=t;setStatus(ST)};
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=migrate(JSON.parse(r));if(o&&typeof o==='object'&&o.v<=SCHEMA)D={...D,...o,settings:{...DEF,...o.settings,w:{...DEF.w,...(o.settings||{}).w}},ui:{...D.ui,...o.ui}}}}catch(e){setStatus('Save failed');toast('Stored data unreadable — export a backup before editing.')}}
let _t;function save(){setStatus('Saving…');if(D.sync)D.sync.dirty=true;clearTimeout(_t);_t=setTimeout(()=>{persist();cloudSoon()},250)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D));setStatus('Saved')}catch(e){setStatus('Save failed');toast('Storage full or blocked. Export a backup now.')}}
const settings=()=>D.settings;

/* ================= Calculations (integer paise) ================= */
const parseEx=t=>(t.exits||'').split('\n').map(l=>l.trim().match(/^(\d+(?:\.\d+)?)\s*@\s*(\d+(?:\.\d+)?)$/)).filter(Boolean).map(m=>[+m[1],+m[2]]);
const dur=t=>{if(!t.entryTime||!t.exitTime)return null;const m=(new Date(t.exitTime+'+05:30')-new Date(t.entryTime+'+05:30'))/6e4;return isFinite(m)&&m>=0?m:null};
/* Zerodha NSE rate card, derived from the supplied brokerage-calculator screenshots (qty 400; every line reproduced to the paisa).
   Rates change — re-verify at zerodha.com/brokerage-calculator. Calculated, not broker-confirmed. */
const RATES={intraday:{pct:.0003,cap:20,sttB:0,sttS:.00025,exch:.0000307,stamp:.00003},delivery:{pct:0,cap:0,sttB:.001,sttS:.001,exch:.0000307,stamp:.00015},
 futures:{flat:20,sttB:0,sttS:.0005,exch:.0000183,stamp:.00002},options:{flat:20,sttB:0,sttS:.0015,exch:.0003553,stamp:.00003},sebi:.000001,gst:.18};
function autoChg(t,c){
 const seg=/Option/.test(t.itype)?'options':t.itype==='Futures'?'futures':t.style==='Intraday'?'intraday':'delivery',R=RATES[seg],q=+t.qty,e=+t.entry;
 const exits=parseEx(t).concat(c.rem>0?[[c.rem,+t.exit]]:[]),ev=e*q,xv=exits.reduce((a,x)=>a+x[0]*x[1],0),lg=t.dir!=='Short',buy=lg?ev:xv,sell=lg?xv:ev;
 const orders=[ev,...exits.map(x=>x[0]*x[1])],r2=x=>Math.round(x*100)/100;                    // brokerage is charged per executed order
 const brok=r2(seg==='delivery'?0:R.flat?R.flat*orders.length:orders.reduce((a,v)=>a+Math.min(R.cap,v*R.pct),0));
 const stt=r2(sell*R.sttS+buy*R.sttB),exch=r2((buy+sell)*R.exch),sebi=r2((buy+sell)*RATES.sebi),gst=r2((brok+exch+sebi)*RATES.gst),stamp=Math.round(buy*R.stamp);   // stamp duty rounds to whole ₹
 const o={seg,brok:P(brok),stt:P(stt),exch:P(exch),gst:P(gst),sebi:P(sebi),stamp:P(stamp)};o.total=o.brok+o.stt+o.exch+o.gst+o.sebi+o.stamp;return o}
function calc(t){
 const q=+t.qty||0,e=+t.entry||0,dir=t.dir==='Short'?-1:1,ex=parseEx(t),rem=q-ex.reduce((a,x)=>a+x[0],0);
 const risk=t.stop?Math.round(Math.abs(P(e)-P(t.stop))*q):null,reward=t.target?Math.round(Math.abs(P(t.target)-P(e))*q):null;
 const c={q,rem,risk,reward,rr:risk&&reward?reward/risk:null,pos:Math.round(P(e)*q),closed:t.status==='Closed'};
 if(c.closed){
  if(q<=0||rem<0||(rem>0&&(t.exit===''||t.exit==null)))c.bad='Exit quantities do not reconcile with entry quantity';
  else{const pr=ex.reduce((a,x)=>a+Math.round(P(x[1])*x[0]),0)+(rem>0?Math.round(P(t.exit)*rem):0);
   c.gross=dir*(pr-c.pos);
   c.chd=t.chMode==='auto'?autoChg(t,c):null;
   c.chg=c.chd?c.chd.total:t.chTotal!==''&&t.chTotal!=null?P(t.chTotal):P(t.chBrok)+P(t.chStt)+P(t.chOther);     // manual: total overrides details, no double counting
   c.net=c.gross-c.chg;c.out=c.net>0?'Win':c.net<0?'Loss':'Breakeven';
   c.R=risk>0?c.net/risk:null;c.ret=c.pos?c.net/c.pos:null;c.mins=dur(t)}}
 return c}
const chron=(a,b)=>(a.date+(a.entryTime||'')).localeCompare(b.date+(b.entryTime||''));
const VL=['No predefined stop','Exceeded planned risk','Impulsive entry','Revenge trade','FOMO entry','Overtrading','Unplanned stop move','Outside trading window','No valid setup','Traded after limit'];
const riskLimit=()=>{const s=settings();return s.riskRs>0?s.riskRs*100:Math.round(s.refCap*100*s.riskPct/100)};
function enrich(list){
 const s=settings(),day={},rl=riskLimit();
 return [...list].sort(chron).map(t=>{
  const c=calc(t),ex=t.status==='Open'||t.status==='Closed',d=day[t.date]||(day[t.date]={n:0,net:0}),v=[];
  c.limOK=!(d.n>=s.maxTrades||-d.net>=s.maxLoss*100);
  if(ex){d.n++;if(c.net!=null)d.net+=c.net;
   if(!t.stop)v.push(VL[0]);if(c.risk&&c.risk>rl)v.push(VL[1]);if(t.impulsive)v.push(VL[2]);if(t.revenge)v.push(VL[3]);if(t.fomo)v.push(VL[4]);if(t.over)v.push(VL[5]);if(t.movedSL)v.push(VL[6]);
   const tm=(t.entryTime||'').slice(11,16);if(tm&&(tm<s.hrFrom||tm>s.hrTo))v.push(VL[7]);if(!t.setup)v.push(VL[8]);if(!c.limOK)v.push(VL[9]);
   const k={},yn=x=>x==='Y'?1:x==='N'?0:undefined;
   k.chk=t.chkTotal?(t.checked||[]).length/t.chkTotal:undefined;
   k.risk=!t.stop||(c.risk&&c.risk>rl)?0:(yn(t.fRisk)??1);k.entry=yn(t.fEntry);k.exit=c.closed?yn(t.fExit):undefined;k.lim=c.limOK?1:0;
   k.beh=Math.max(0,1-.34*['fomo','revenge','impulsive','movedSL','early','over'].filter(f=>t[f]).length);
   let a=0,b=0;for(const x in k)if(k[x]!==undefined){a+=s.w[x]*k[x];b+=s.w[x]}   // missing data is excluded, weights renormalised
   c.k=k;c.score=b?Math.round(a/b*100):null}
  c.v=v;return {...t,c}})}
const sum=a=>a.reduce((x,t)=>x+t.c.net,0);
function M(L,o={}){
 const cl=L.filter(t=>t.c.net!=null),w=cl.filter(t=>t.c.net>0),l=cl.filter(t=>t.c.net<0),n=cl.length,gp=sum(w),gl=-sum(l),net=gp-gl;
 let eq=o.start??settings().capital*100,base=eq,pnl=0,pkP=0,dd=0,ddB=base;const pts=[{l:'Start',v:eq}];
 /* equity includes top-ups/withdrawals; drawdown uses realised P&L only, so a top-up never hides a loss */
